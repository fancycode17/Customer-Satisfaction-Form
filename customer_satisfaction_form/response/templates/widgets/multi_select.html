{% for o in options %}
    <input type="checkbox" 
        id="opt-{{ q.id }}-{{ o.id }}" 
        name="question_{{ q.id }}" 
        value="{{ o.label }}"
        {% if o.label in checked %}checked{% endif %}>

    <label for="opt-{{ q.id }}-{{ o.id }}"> {{ o.label }}</label><br>

    {% if o.label|lower == 'other' %}

        <div id="other-text-{{ o.id }}" 
            style="display:none; margin-left:20px;">
                <textarea id="other-detail-{{ o.id }}" 
                    name="other_detail_{{ q.id }}" 
                    cols="45" 
                    rows="5" 
                    placeholder="Please elaborate">{% if other_detail %}{{ other_detail }}{% endif%}</textarea>
        </div>

        <script>
        document.getElementById("opt-{{ q.id }}-{{ o.id }}").addEventListener("change", function() {{
            const box = document.getElementById("other-text-{{ o.id }}");
            const input = document.getElementById("other-detail-{{ o.id }}");
            if (this.checked) {{
                box.style.display = "block";
                input.setAttribute("required", "required");
            }} else {{
                box.style.display = "none";
                input.removeAttribute("required");
            }}
        }});
        </script>
    {% endif %}
{% endfor %}
